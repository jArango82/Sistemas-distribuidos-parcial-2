# CI: en cada push se prueba la API, se validan los manifiestos y se despliega
# TODO en un clúster de Kubernetes real (kind) para probar CRUD, balanceo y volumen.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas-api:
    name: Pruebas unitarias de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: pytest -q
        working-directory: api

  manifiestos:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: kubeconform -strict -summary k8s/

  e2e-kubernetes:
    name: Despliegue end-to-end en Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [pruebas-api, manifiestos]
    steps:
      - uses: actions/checkout@v4
      - name: Crear clúster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: parcial2

      - name: Desplegar (scripts/deploy.sh)
        run: ./scripts/deploy.sh

      - name: Punto 1 · Probar el CRUD
        run: |
          kubectl -n parcial2 port-forward svc/api-crud-lb 8080:80 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health > /dev/null && break; sleep 1; done
          ./scripts/test-crud.sh http://localhost:8080

      - name: Punto 1 · Probar el balanceo entre los 2 pods
        run: ./scripts/test-balanceo.sh

      - name: Punto 3 · Probar la persistencia del volumen
        run: ./scripts/test-persistencia.sh

      - name: Estado final del clúster
        if: always()
        run: kubectl -n parcial2 get all,pvc -o wide && kubectl get pv

      - name: Diagnóstico (si algo falló)
        if: failure()
        run: |
          kubectl -n parcial2 describe pods
          kubectl -n parcial2 logs -l app=api-crud --all-containers --tail=100
          kubectl -n parcial2 logs -l app=postgres --tail=100
