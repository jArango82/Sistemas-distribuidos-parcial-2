# Secret: credenciales de PostgreSQL.
# Las usan el contenedor de PostgreSQL (POSTGRES_*) y la API (DB_USER, DB_PASSWORD, DB_NAME).
# stringData permite escribirlas en texto plano; Kubernetes las guarda en base64.
# ⚠️ En un proyecto real este archivo NO se sube al repositorio (se usa Sealed Secrets,
#    External Secrets, Vault, etc.). Aquí se deja por fines académicos.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: parcial2
  labels:
    app.kubernetes.io/part-of: parcial2
type: Opaque
stringData:
  POSTGRES_USER: parcial2
  POSTGRES_PASSWORD: Sistemas-Distribuidos-2026
  POSTGRES_DB: inventario
